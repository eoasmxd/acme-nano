name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Code Formatting & Vet
        run: |
          go vet ./...

      - name: Validate Linux Build
        run: |
          go build -v -o /dev/null ./cmd/manual
          go build -v -o /dev/null ./cmd/cloudflare
          go build -v -o /dev/null ./cmd/aliyun
          go build -v -o /dev/null ./cmd/dnspod
          go build -v -o /dev/null ./cmd/aws
          go build -v -o /dev/null ./cmd/gd
          go build -v -o /dev/null ./cmd/dgon
          go build -v -o /dev/null ./cmd/gcloud
          go build -v -o /dev/null ./cmd/namecheap
          go build -v -o /dev/null ./cmd/azure
          go build -v -o /dev/null ./cmd/ovh
          go build -v -o /dev/null ./cmd/hetznercloud
          go build -v -o /dev/null ./cmd/duckdns
          go build -v -o /dev/null ./cmd/porkbun
          go build -v -o /dev/null ./cmd/namesilo
          go build -v -o /dev/null ./cmd/vultr

      - name: Validate Windows Build
        run: |
          env GOOS=windows go build -v -o /dev/null ./cmd/manual
          env GOOS=windows go build -v -o /dev/null ./cmd/cloudflare
          env GOOS=windows go build -v -o /dev/null ./cmd/aliyun
          env GOOS=windows go build -v -o /dev/null ./cmd/dnspod
          env GOOS=windows go build -v -o /dev/null ./cmd/aws
          env GOOS=windows go build -v -o /dev/null ./cmd/gd
          env GOOS=windows go build -v -o /dev/null ./cmd/dgon
          env GOOS=windows go build -v -o /dev/null ./cmd/gcloud
          env GOOS=windows go build -v -o /dev/null ./cmd/namecheap
          env GOOS=windows go build -v -o /dev/null ./cmd/azure
          env GOOS=windows go build -v -o /dev/null ./cmd/ovh
          env GOOS=windows go build -v -o /dev/null ./cmd/hetznercloud
          env GOOS=windows go build -v -o /dev/null ./cmd/duckdns
          env GOOS=windows go build -v -o /dev/null ./cmd/porkbun
          env GOOS=windows go build -v -o /dev/null ./cmd/namesilo
          env GOOS=windows go build -v -o /dev/null ./cmd/vultr

