name: Publish

on:
  workflow_dispatch:
    inputs:
      publish_docker:
        description: 'Publish Docker image (GHCR & Docker Hub)'
        type: boolean
        required: true
        default: true
      publish_release:
        description: 'Publish GitHub Release binary packages'
        type: boolean
        required: true
        default: false

jobs:
  release-binaries:
    name: Build & Release Binaries
    if: ${{ github.event.inputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep 'var version string' core/version.go | cut -d '"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Build cross-platform packages
        run: |
          bash ./package.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: v${{ env.VERSION }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Build & Push Docker Image
    if: ${{ github.event.inputs.publish_docker == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: extract
        run: |
          VERSION=$(grep 'var version string' core/version.go | cut -d '"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_dockerhub=true" >> $GITHUB_OUTPUT
          else
            echo "has_dockerhub=false" >> $GITHUB_OUTPUT
          fi
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.extract.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || github.actor }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker Tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAGS="ghcr.io/${OWNER}/acme-nano:${{ env.VERSION }},ghcr.io/${OWNER}/acme-nano:latest"

          if [ -n "$DOCKERHUB_TOKEN" ]; then
            DOCKER_USER=$(echo "${{ secrets.DOCKERHUB_USERNAME || github.actor }}" | tr '[:upper:]' '[:lower:]')
            TAGS="$TAGS,docker.io/$DOCKER_USER/acme-nano:${{ env.VERSION }},docker.io/$DOCKER_USER/acme-nano:latest"
          fi

          echo "DOCKER_TAGS=$TAGS" >> $GITHUB_ENV
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push acme-nano
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
          push: true
          tags: ${{ env.DOCKER_TAGS }}

